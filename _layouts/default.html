<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">

        {{ content }}

      </div>
    </main>

    {%- if site.data.footer_notes and site.data.footer_notes.size > 0 -%}
    <footer class="site-footer">
      <div class="wrapper">
        <span
          class="footer-note"
          id="footer-note"
          data-notes='{{ site.data.footer_notes | jsonify }}'
        >{{ site.data.footer_notes | first }}</span>
      </div>
    </footer>
    {%- endif -%}

</body>

</html>
