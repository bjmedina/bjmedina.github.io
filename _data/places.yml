# cafes & restaurants i've liked. add entries freely.
#
# fields per entry:
#   name          - the place
#   type          - cafe | restaurant | bar | bakery | anything else
#   city          - city, used to group entries on the page
#   neighborhood  - optional, e.g. "Harvard Square"
#   lat / lon     - coordinates. get them from google maps:
#                   right-click a spot → "what's here?" → copy the two numbers
#   visited       - YYYY-MM-DD you went (used to sort within a city)
#   rating        - optional 1-5
#   note          - optional short line, shown under the entry
#
# the three placeholders below are just so the map isn't empty on first load.
# delete them when you drop in real spots.

