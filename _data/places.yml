# cafes & restaurants i've liked. add entries freely.
#
# fields per entry:
#   name          - the place
#   type          - cafe | restaurant | bar | bakery | anything else
#   city          - city, used to group entries on the page
#   neighborhood  - optional, e.g. "Harvard Square"
#   lat / lon     - coordinates (from a google maps link)
#   rating        - optional 1-5
#   note          - optional short line, shown under the entry
#
# entries render in the order they appear here, grouped by city.

